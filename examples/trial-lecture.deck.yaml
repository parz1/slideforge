meta:
  title: "Graph DFS and Postfix Notation"
  language: "zh-CN"
  theme: "teaching"
  template: "teaching"
slides:
  - id: "cover"
    type: "cover"
    title: "图的深度优先探索与后缀记法"
    content:
      subtitle: "面向试讲的解题课设计"
    animation:
      preset: "none"
    speakerNotes: "开场：今天不是讲背答案，而是讲如何从程序行为推回算法结构。先做图搜索，再做表达式求值，两个题的共同点都是用栈管理顺序。"

  - id: "goals"
    type: "metric_grid"
    title: "这节课要解决什么"
    content:
      metrics:
        - label: "题型 1"
          value: "DFS"
          note: "读 Python 递归程序"
        - label: "题型 2"
          value: "Stack"
          note: "后缀记法求值"
        - label: "核心能力"
          value: "Trace"
          note: "手动追踪状态变化"
    speakerNotes: "建议时长：全课 35-45 分钟。DFS 约 25 分钟，后缀记法 10-15 分钟，最后 3 分钟总结。"

  - id: "lesson-thread"
    type: "principle_card"
    title: "讲课主线"
    content:
      cards:
        - title: "会追踪状态，就能读懂程序"
          body: "把每一步的状态写出来：当前顶点、visited、forest、栈。学生只要会追踪状态，就能稳定解这类题。"
    animation:
      preset: "highlight_key_points"

  - id: "problem-breakdown"
    type: "two_column"
    title: "题目拆解"
    content:
      columns:
        - title: "图搜索"
          items:
            - "读懂 graph 的邻接表结构"
            - "追踪 dfs(start) 的递归展开"
            - "解释递归成本"
            - "改写成非递归算法"
        - title: "后缀记法"
          items:
            - "计算表达式结果"
            - "说明为什么适合计算机处理"
            - "用栈模拟求值过程"
    speakerNotes: "这里提醒学生：DFS 的递归调用栈、后缀记法的操作数栈，本质上都在管理暂存状态。"

  - id: "graph-structure"
    type: "code_explain"
    title: "DFS：先看数据结构"
    content:
      language: "python"
      code: |
        nodes = ["A", "B", "C", "D", "E", "F", "G", "H"]

        graph = {
            "A": {"B", "D"},
            "B": {"A", "C", "E"},
            "C": {"B", "F"},
            "D": {"A"},
            "E": {"B", "F"},
            "F": {"C", "E"},
            "G": {"H"},
            "H": {"G"},
        }
      note: "这是邻接表。A-F 是一个连通分量，G-H 是另一个连通分量。"
    speakerNotes: "讲法：先让学生从 graph 看出两个岛：A-B-C-D-E-F 连在一起，G-H 单独连在一起。"

  - id: "dfs-template"
    type: "code_explain"
    title: "DFS 递归模板"
    content:
      language: "python"
      code: |
        def dfs(graph, start, visited):
            if visited is None:
                visited = set()

            visited.add(start)

            for next_node in graph[start] - visited:
                if next_node not in visited:
                    dfs(graph, next_node, visited)

            return visited
      points:
        - "当前顶点先加入 visited。"
        - "再从 graph[start] 中挑未访问的相邻顶点继续递归。"
        - "graph[start] 是 set，遍历顺序不是固定的。"
    speakerNotes: "注意：DFS 内部访问顺序可能变，但最终连通分量不变。"

  - id: "forest-trace"
    type: "trace_table"
    title: "手动追踪 forest"
    content:
      columns:
        - "Step"
        - "Outer loop"
        - "Action"
        - "v"
        - "vd"
        - "forest"
      rows:
        - [
            "1",
            "n = A",
            "A not in vd, call DFS",
            "{A,B,C,D,E,F}",
            "{A,B,C,D,E,F}",
            "[{A,B,C,D,E,F}]",
          ]
        - ["2", "n = B ... F", "already in vd, skip", "-", "{A,B,C,D,E,F}", "unchanged"]
        - [
            "3",
            "n = G",
            "G not in vd, call DFS",
            "{G,H}",
            "{A,B,C,D,E,F,G,H}",
            "[{A,B,C,D,E,F}, {G,H}]",
          ]
        - ["4", "n = H", "already in vd, skip", "-", "{A,B,C,D,E,F,G,H}", "unchanged"]
      note: "forest 保存的是每次 DFS 返回的 visited 集合，也就是连通分量。"
    speakerNotes: "重点：外层 for 不是每个顶点都调用 DFS；已经在 vd 里的点会跳过。"

  - id: "iterative-dfs"
    type: "workflow"
    title: "非递归 DFS 的板书图"
    content:
      steps:
        - label: "初始化"
          body: "stack = [start], visited = {}, forest = []"
        - label: "取顶点"
          body: "vertex = stack.pop()"
        - label: "访问"
          body: "若未访问，则加入 visited 和 forest"
        - label: "扩展"
          body: "把相邻顶点逆序压入 stack"
        - label: "终止"
          body: "stack 为空时结束"
    speakerNotes: "对应非递归 DFS。为了保持和递归 DFS 类似的访问顺序，通常要注意压栈顺序。"

  - id: "postfix-answer"
    type: "principle_card"
    title: "后缀记法：先算答案"
    content:
      cards:
        - title: "1 2 + 3 4 - *"
          body: "转成中缀是 (1 + 2) * (3 - 4)，结果是 -3。"
        - title: "为什么适合计算机"
          body: "从左到右扫描一次：数字压栈，运算符弹出两个数计算，再把结果压回栈。"
    speakerNotes: "注意减法和除法的操作数顺序：先弹出的是右操作数，后弹出的是左操作数。"

  - id: "postfix-trace"
    type: "trace_table"
    title: "后缀表达式求值过程"
    content:
      columns:
        - "Token"
        - "Action"
        - "Stack"
      rows:
        - ["1", "push 1", "[1]"]
        - ["2", "push 2", "[1, 2]"]
        - ["+", "pop 2, pop 1, push 3", "[3]"]
        - ["3", "push 3", "[3, 3]"]
        - ["4", "push 4", "[3, 3, 4]"]
        - ["-", "pop 4, pop 3, push -1", "[3, -1]"]
        - ["*", "pop -1, pop 3, push -3", "[-3]"]
      note: "最后栈顶就是表达式结果。"

  - id: "practice"
    type: "checklist"
    title: "课堂练习"
    content:
      items:
        - "给一张小图，手动写出 DFS visited 顺序"
        - "把递归 DFS 改写成显式栈版本"
        - "计算一个新的后缀表达式：5 1 2 + 4 * + 3 -"
    speakerNotes: "练习答案：5 + ((1 + 2) * 4) - 3 = 14。这页可以用作试讲最后 3 分钟互动。"

  - id: "closing"
    type: "closing"
    title: "试讲结束语"
    content:
      statement: "会追踪状态，就能读懂程序。"
    animation:
      preset: "highlight_key_points"
